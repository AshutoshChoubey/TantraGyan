    <text x="195" y="52" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#1e293b">• गुरु (ज्ञान) + शुक्र (तप) + केतु (मोक्ष) = संन्यास, अलौकिक अंतर्ज्ञान, जगद्गुरु पद, निःस्वार्थ लोकमंगल।</text>
