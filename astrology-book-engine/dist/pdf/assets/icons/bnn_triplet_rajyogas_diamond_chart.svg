    <text x="195" y="52" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#1e293b">• शनि (कर्म) + बुध (व्यापार) + शुक्र (धन/लक्ष्मी) = बहुराष्ट्रीय व्यापार, विशाल धन सम्पदा, वैश्विक ब्रांड।</text>
