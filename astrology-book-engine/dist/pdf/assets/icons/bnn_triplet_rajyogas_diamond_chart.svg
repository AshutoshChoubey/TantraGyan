  <text x="280" y="55" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">Master Triplet Combinations in Bhrigu Nandi Nadi</text>
  <text x="280" y="70" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="9" font-weight="600" fill="#78716c" text-anchor="middle">Root (बीज), Carrier (माध्यम) एवं Fruit (फल) की शास्त्रीय श्रृंखला</text>


  
