    <text x="90" y="66" text-anchor="middle" font-family="'Kohinoor Devanagari', sans-serif" font-size="9" font-weight="700" fill="#475569">त्रि-ग्रहीय महायोग</text>

    <!-- Description on the right -->
    <text x="195" y="28" font-family="'Noto Serif Devanagari', serif" font-size="12.5" font-weight="800" fill="#b45309">सर्वोच्च प्रशासनिक योग (IAS / Cabinet)</text>
    <text x="195" y="52" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#1e293b">• गुरु (जीव) + शनि (कर्म) + सूर्य (शासन) = देश/संस्थान का सर्वोच्च नेतृत्व, स्थायी मान-सम्मान व राजसत्ता।</text>
