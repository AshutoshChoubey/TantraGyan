    <text x="195" y="52" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#1e293b">• मंगल (यंत्र) + शनि (श्रम/उद्योग) + राहु (विदेशी/सॉफ्टवेयर) = रक्षा तकनीक, एयरोस्पेस, विदेश में बड़ा उद्योग।</text>
