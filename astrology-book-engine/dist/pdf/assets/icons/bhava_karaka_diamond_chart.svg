<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" width="100%" height="100%" class="astro-chart-svg astro-karaka-chart">
  <defs>
    <linearGradient id="karakaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffefd"/>
      <stop offset="100%" stop-color="#faf5e6"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="548" height="688" rx="12" fill="url(#karakaBg)" stroke="#c89d3d" stroke-width="2"/>
  <rect x="12" y="12" width="536" height="676" rx="8" fill="none" stroke="#eab308" stroke-width="0.8" stroke-dasharray="6,3" opacity="0.6"/>
  <!-- Header Banner -->
  <rect x="24" y="20" width="512" height="66" rx="6" fill="#ffffff" stroke="#c89d3d" stroke-width="1.2"/>
  <text x="280" y="42" font-family="'Noto Serif Devanagari', 'Kohinoor Devanagari', 'Georgia', serif" font-size="16" font-weight="800" fill="#78350f" text-anchor="middle">द्वादश भाव कारकत्व व स्थिर ग्रह चक्र</text>
  <text x="280" y="60" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">द्वादश भावों के नैसर्गिक स्थिर कारक (Sthira Karakas)</text>
  <text x="280" y="74" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#78716c" text-anchor="middle">भाव बली होने पर भी कारक के पीड़ित होने से उस जीवन-क्षेत्र में न्यूनता आती है</text>
  <!-- Diamond Kundali (X: 30 to 530, Y: 96 to 596) -->
  <g transform="translate(10, 0)">
    <polygon points="270,100 395,225 270,350 145,225" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <polygon points="20,100 270,100 145,225" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
    <polygon points="20,100 145,225 20,350" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <polygon points="20,350 145,225 270,350 145,475" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <polygon points="20,350 145,475 20,600" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
    <polygon points="20,600 145,475 270,600" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <polygon points="270,350 395,475 270,600 145,475" fill="#fdf2f8" stroke="#f43f5e" stroke-width="1.8"/>
    <polygon points="270,600 395,475 520,600" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <polygon points="520,600 395,475 520,350" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
    <polygon points="270,350 395,225 520,350 395,475" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <polygon points="520,350 395,225 520,100" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
    <polygon points="520,100 395,225 270,100" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <polygon points="270,100 520,350 270,600 20,350" fill="none" stroke="#78350f" stroke-width="1.2" opacity="0.65"/>
    <line x1="20" y1="100" x2="520" y2="600" stroke="#78350f" stroke-width="1.0" opacity="0.5"/>
    <line x1="520" y1="100" x2="20" y2="600" stroke="#78350f" stroke-width="1.0" opacity="0.5"/>
    <circle cx="270" cy="350" r="4.5" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    <!-- House 1 -->
    <text x="270.0" y="207.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#c2410c" text-anchor="middle">भाव 1 • सूर्य (Sun)</text>
    <text x="270.0" y="221.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">तनु भाव (Body &amp; Soul)</text>
    <text x="270.0" y="233.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">आत्मबल, तेज, देह, आरोग्यता</text>
    <!-- House 2 -->
    <text x="145.0" y="128.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#b45309" text-anchor="middle">भाव 2 • गुरु (Jupiter)</text>
    <text x="145.0" y="142.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">धन भाव (Wealth &amp; Speech)</text>
    <text x="145.0" y="154.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">संचित कोष, वाणी, कुटुंब संस्कार</text>
    <!-- House 3 -->
    <text x="62.0" y="211.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#dc2626" text-anchor="middle">भाव 3 • मंगल (Mars)</text>
    <text x="62.0" y="225.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">सहज भाव (Courage &amp; Siblings)</text>
    <text x="62.0" y="237.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">शौर्य, पराक्रम, अनुज भ्राता, उद्यम</text>
    <!-- House 4 -->
    <text x="145.0" y="332.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#334155" text-anchor="middle">भाव 4 • चन्द्र व शुक्र</text>
    <text x="145.0" y="346.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">सुख भाव (Mother &amp; Vehicles)</text>
    <text x="145.0" y="358.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">मातृ सुख, गृह, वाहन, मानसिक शांति</text>
    <!-- House 5 -->
    <text x="62.0" y="461.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#b45309" text-anchor="middle">भाव 5 • गुरु (Jupiter)</text>
    <text x="62.0" y="475.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">पुत्र भाव (Wisdom &amp; Children)</text>
    <text x="62.0" y="487.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">संतति, पूर्वपुण्य, मेधा, मंत्र साधना</text>
    <!-- House 6 -->
    <text x="145.0" y="544.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#1d4ed8" text-anchor="middle">भाव 6 • शनि व मंगल</text>
    <text x="145.0" y="558.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">रिपु भाव (Debts &amp; Disease)</text>
    <text x="145.0" y="570.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">शत्रु विजय, रोग निदान, ऋण मुक्ति</text>
    <!-- House 7 -->
    <text x="270.0" y="457.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#be185d" text-anchor="middle">भाव 7 • शुक्र (Venus)</text>
    <text x="270.0" y="471.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">जाया भाव (Spouse &amp; Trade)</text>
    <text x="270.0" y="483.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">जीवनसाथी, काम सुख, व्यापार साझेदारी</text>
    <!-- House 8 -->
    <text x="395.0" y="544.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#1d4ed8" text-anchor="middle">भाव 8 • शनि (Saturn)</text>
    <text x="395.0" y="558.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">आयु भाव (Longevity &amp; Occult)</text>
    <text x="395.0" y="570.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">दीर्घायु, गूढ़ विद्या, आकस्मिक धन</text>
    <!-- House 9 -->
    <text x="478.0" y="461.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#b45309" text-anchor="middle">भाव 9 • गुरु व सूर्य</text>
    <text x="478.0" y="475.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">भाग्य भाव (Dharma &amp; Guru)</text>
    <text x="478.0" y="487.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">धर्म, पिता, ईश्वरीय कृपा, तीर्थाटन</text>
    <!-- House 10 -->
    <text x="395.0" y="332.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#c2410c" text-anchor="middle">भाव 10 • सूर्य/बुध/शनि</text>
    <text x="395.0" y="346.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">कर्म भाव (Career &amp; Authority)</text>
    <text x="395.0" y="358.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">राज्य पद, प्रतिष्ठा, आजीविका शिखर</text>
    <!-- House 11 -->
    <text x="478.0" y="211.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#b45309" text-anchor="middle">भाव 11 • गुरु (Jupiter)</text>
    <text x="478.0" y="225.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">लाभ भाव (Income &amp; Gains)</text>
    <text x="478.0" y="237.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">सर्व कामना सिद्धि, प्रचुर धनोपार्जन</text>
    <!-- House 12 -->
    <text x="395.0" y="128.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#1d4ed8" text-anchor="middle">भाव 12 • शनि व केतु</text>
    <text x="395.0" y="142.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">व्यय भाव (Moksha &amp; Foreign)</text>
    <text x="395.0" y="154.0" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">मोक्ष, विसर्जन, विदेश वास, एकांत</text>
  </g>
  <g transform="translate(24, 608)">
    <rect x="0" y="0" width="512" height="74" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="18" y="20" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#713f12">भाव-भावेश-कारक त्रिसूत्री सिद्धांत (The Triple Pillars of Prediction)</text>
    <text x="18" y="37" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#713f12">1. भाव (House): घटना का मंच है। भाव पर शुभ ग्रहों का प्रभाव उसे पुष्ट करता है।</text>
    <text x="18" y="51" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#713f12">2. भावेश (Lord): घटना का नियंत्रक है। भावेश केन्द्र या त्रिकोण में होने पर पूर्ण सामर्थ्य प्रदान करता है।</text>
    <text x="18" y="65" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#713f12">3. कारक (Significator): घटना की प्राणवायु है। यदि भावेश बली हो किंतु कारक अस्त या नीच हो, तो सुख अधूरा रहता है।</text>
  </g>
</svg>