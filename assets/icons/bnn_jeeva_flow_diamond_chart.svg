<svg viewBox="0 0 600 680" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" class="select-none">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="50%" stop-color="#fbf8f0"/>
      <stop offset="100%" stop-color="#f5eedb"/>
    </linearGradient>
    <linearGradient id="flowHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fefcf6"/>
    </linearGradient>
    <filter id="flowShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#78350f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .header-box { fill: url(#flowHeadGrad); stroke: #b45309; stroke-width: 1.8; filter: url(#flowShadow); }
    .header-inner { fill: none; stroke: #d97706; stroke-width: 0.8; stroke-dasharray: 4,2; }
    .header-sub-tag { font-size: 11px; font-weight: 800; fill: #b45309; letter-spacing: 0.08em; font-family: 'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', sans-serif; text-anchor: middle; }
    .header-title { font-size: 16px; font-weight: 900; fill: #78350f; font-family: 'Noto Serif Devanagari', 'Kohinoor Devanagari', Georgia, serif; text-anchor: middle; }
    .header-meta { font-size: 10.5px; font-weight: 600; fill: #44403c; font-family: 'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', sans-serif; text-anchor: middle; }
    .chart-bg { fill: url(#flowBg); filter: url(#flowShadow); }
    .grid-line { fill: none; stroke: #09090b; stroke-width: 2.0; stroke-linejoin: round; }
    .house-num { font-size: 13.5px; font-weight: 900; fill: #78350f; font-family: -apple-system, sans-serif; paint-order: stroke fill; stroke: #fffdf7; stroke-width: 3px; }
    .flow-badge { font-family: 'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', sans-serif; font-size: 10.5px; font-weight: 800; text-anchor: middle; }
    .flow-sub { font-family: 'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', sans-serif; font-size: 8.5px; font-weight: 600; text-anchor: middle; }
    .flow-desc { font-family: 'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', sans-serif; font-size: 8px; font-weight: 500; text-anchor: middle; }
  </style>

  <!-- Top Header Box -->
  <rect x="18" y="10" width="564" height="80" rx="8" class="header-box"/>
  <rect x="22" y="14" width="556" height="72" rx="6" class="header-inner"/>
  <text x="300" y="32" class="header-sub-tag">भृगु नंदी नाड़ी • BHRIGU NANDI NADI FLOW SYSTEM</text>
  <text x="300" y="54" class="header-title">जीव-लग्न भाव-प्रवाह एवं अग्र-पृष्ठ तीर-आरेख</text>
  <text x="300" y="74" class="header-meta">गुरु (पुरुष) / शुक्र (स्त्री) प्रथम भाव • वामावर्त 12 भाव गणना • अग्र-पृष्ठ संबंध</text>

  <!-- Diamond Outer Frame (X: 18 to 582, Y: 100 to 570) -->
  <rect x="18" y="100" width="564" height="470" rx="10" class="chart-bg" stroke="#b45309" stroke-width="2.6"/>

  <!-- Main Diagonal Cross Lines -->
  <line x1="18" y1="100" x2="582" y2="570" class="grid-line" stroke="#78350f"/>
  <line x1="582" y1="100" x2="18" y2="570" class="grid-line" stroke="#78350f"/>

  <!-- Inner Rhombus Diamond -->
  <polygon points="300,100 582,335 300,570 18,335" class="grid-line" stroke="#b45309" stroke-width="2.4" fill="none"/>

  <!-- Highlighting Center Jeeva Lagna (1st House) -->
  <polygon points="300,100 441,217.5 300,335 159,217.5" fill="rgba(217, 119, 6, 0.12)"/>
  <!-- Highlighting 2nd House (Front / Next) -->
  <polygon points="18,100 300,100 159,217.5" fill="rgba(16, 185, 129, 0.10)"/>
  <!-- Highlighting 12th House (Rear / Past) -->
  <polygon points="300,100 582,100 441,217.5" fill="rgba(239, 68, 68, 0.10)"/>
  <!-- Highlighting 5th & 9th Trines -->
  <polygon points="18,335 159,452.5 18,570" fill="rgba(59, 130, 246, 0.10)"/>
  <polygon points="582,335 441,452.5 582,570" fill="rgba(59, 130, 246, 0.10)"/>

  <!-- House 1 (Center Top): Jeeva Lagna -->
  <text x="300" y="295" class="house-num" text-anchor="middle">1</text>
  <text x="300" y="180" class="flow-badge" fill="#b45309">प्रथम भाव: जीव लग्न (100% केंद्र)</text>
  <text x="300" y="200" class="flow-sub" fill="#1e293b">गुरु (पुरुष चा र्ट) / शुक्र (स्त्री चा र्ट)</text>
  <text x="300" y="218" class="flow-desc" fill="#57534e">जातक का प्राण, शरीर, मूल प्रकृति व पहचान</text>

  <!-- House 2: Front / Next Step (+1 Rashi, 15% Front) -->
  <text x="200" y="125" class="house-num" text-anchor="middle">2</text>
  <text x="160" y="150" class="flow-badge" fill="#059669">2रा भाव: अग्रिम गति (+1 राशि)</text>
  <text x="160" y="166" class="flow-sub" fill="#047857">[15% फ्रंट] भविष्य / अगला कदम</text>
  <text x="160" y="182" class="flow-desc" fill="#475569">वाणी, संचित धन, परिवार व अगला मिलन</text>

  <!-- House 12: Rear / Past Karma (-1 Rashi, 15% Rear) -->
  <text x="400" y="125" class="house-num" text-anchor="middle">12</text>
  <text x="440" y="150" class="flow-badge" fill="#dc2626">12वां भाव: पृष्ठ आधार (-1 राशि)</text>
  <text x="440" y="166" class="flow-sub" fill="#b91c1c">[15% रियर] संचित प्रारब्ध / अतीत</text>
  <text x="440" y="182" class="flow-desc" fill="#475569">पिछला सहारा, व्यय, मोक्ष व वक्री गति</text>

  <!-- House 3: Effort & Sibling (25%) -->
  <text x="75" y="215" class="house-num" text-anchor="middle">3</text>
  <text x="80" y="240" class="flow-badge" fill="#0284c7">3रा: पराक्रम (25%)</text>
  <text x="80" y="255" class="flow-desc" fill="#64748b">साहस, संचार व कौशल</text>

  <!-- House 4: Base / Happiness -->
  <text x="260" y="340" class="house-num" text-anchor="middle">4</text>
  <text x="160" y="325" class="flow-badge" fill="#0d9488">4था भाव: सुख व आधार</text>
  <text x="160" y="342" class="flow-desc" fill="#134e4a">माता, भूमि, वाहन व मानसिक शांति</text>

  <!-- House 5: 1st Trine (75% Purva Punya) -->
  <text x="75" y="460" class="house-num" text-anchor="middle">5</text>
  <text x="80" y="490" class="flow-badge" fill="#2563eb">5वां भाव: प्रथम त्रिकोण (75%)</text>
  <text x="80" y="506" class="flow-sub" fill="#1d4ed8">पूर्व पुण्य, संतान व बुद्धि</text>
  <text x="80" y="522" class="flow-desc" fill="#475569">बिना संघर्ष प्राप्त होने वाला प्रारब्ध</text>

  <!-- House 6: Disease & Debt -->
  <text x="215" y="555" class="house-num" text-anchor="middle">6</text>
  <text x="215" y="520" class="flow-badge" fill="#9f1239">6ठा: रोग/ऋण/सेवा</text>

  <!-- House 7: Samasaptaka (50% Direct Aspect) -->
  <text x="300" y="375" class="house-num" text-anchor="middle">7</text>
  <text x="300" y="450" class="flow-badge" fill="#7c3aed">7वां भाव: समसप्तक (50% प्रत्यक्ष दृष्टि)</text>
  <text x="300" y="468" class="flow-sub" fill="#6d28d9">जीवनसाथी, साझेदारी व प्रत्यक्ष संवाद</text>
  <text x="300" y="484" class="flow-desc" fill="#4c1d95">जीव के ठीक सामने बैठा ग्रह 50% सीधा प्रभाव डालता है</text>

  <!-- House 8: Longevity & Crisis -->
  <text x="385" y="555" class="house-num" text-anchor="middle">8</text>
  <text x="385" y="520" class="flow-badge" fill="#9f1239">8वां: संकट/गूढ़ विद्या</text>

  <!-- House 9: 2nd Trine (75% Dharma & Bhagya) -->
  <text x="525" y="460" class="house-num" text-anchor="middle">9</text>
  <text x="520" y="490" class="flow-badge" fill="#2563eb">9वां भाव: द्वितीय त्रिकोण (75%)</text>
  <text x="520" y="506" class="flow-sub" fill="#1d4ed8">भाग्य, पिता, धर्म व उच्च शिक्षा</text>
  <text x="520" y="522" class="flow-desc" fill="#475569">आध्यात्मिक उत्थान व भाग्योदय नियंत्रण</text>

  <!-- House 10: Karma & Profession -->
  <text x="340" y="340" class="house-num" text-anchor="middle">10</text>
  <text x="440" y="325" class="flow-badge" fill="#b45309">10वां भाव: कर्म व अधिकार</text>
  <text x="440" y="342" class="flow-desc" fill="#78350f">आजीविका, पद-प्रतिष्ठा व सामाजिक प्रभाव</text>

  <!-- House 11: Gains (25%) -->
  <text x="525" y="215" class="house-num" text-anchor="middle">11</text>
  <text x="520" y="240" class="flow-badge" fill="#0284c7">11वां: सर्वलाभ (25%)</text>
  <text x="520" y="255" class="flow-desc" fill="#64748b">आय, बड़े भाई-बहन व इच्छापूर्ति</text>

  <!-- Bottom Legend Banner -->
  <rect x="18" y="585" width="564" height="80" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="300" y="607" font-family="'Noto Serif Devanagari', serif" font-size="12px" font-weight="800" fill="#78350f" text-anchor="middle">★ भृगु नंदी नाड़ी अग्र-पृष्ठ एवं कर्तरी नियम (Hemming & Sequence Rules) ★</text>
  <text x="300" y="627" font-family="'Kohinoor Devanagari', 'Poppins', sans-serif" font-size="10.5px" font-weight="600" fill="#1e293b" text-anchor="middle">• अग्र नियम (+1 राशि): ग्रह का भविष्य व अगला कदम • पृष्ठ नियम (-1 राशि): ग्रह का अतीत व संचित बल</text>
  <text x="300" y="647" font-family="'Kohinoor Devanagari', 'Poppins', sans-serif" font-size="10px" font-weight="500" fill="#57534e" text-anchor="middle">• 12वें व 2रे में पापी ग्रह = बंधन योग (Bandhana Yoga) • 12वें व 2रे में शुभ ग्रह = सुरक्षा कवच (Suraksha Kavach)</text>
</svg>