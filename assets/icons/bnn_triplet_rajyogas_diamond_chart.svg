<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 770" width="100%" height="100%">

  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800;900&amp;family=Noto+Serif+Devanagari:wght@700;800;900&amp;display=swap");
    </style>
    <linearGradient id="plateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffefc"/>
      <stop offset="50%" stop-color="#fdfbf5"/>
      <stop offset="100%" stop-color="#faf5ea"/>
    </linearGradient>
    <linearGradient id="goldBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="kendraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="trikonaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#d1fae5" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="upachayaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#f3e8ff" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="marakaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#fecdd3" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="cardPlateShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#78350f" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Outer Plate Frame -->
  <rect x="6" y="6" width="548" height="758" rx="12" fill="url(#plateBg)" stroke="#b45309" stroke-width="2" filter="url(#cardPlateShadow)"/>
  <rect x="12" y="12" width="536" height="746" rx="8" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="6,3" opacity="0.6"/>

  
  <!-- Top Header Banner -->
  <rect x="20" y="16" width="520" height="66" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="280" y="38" font-family="'Noto Serif Devanagari', 'Kohinoor Devanagari', Georgia, serif" font-size="15" font-weight="900" fill="#78350f" text-anchor="middle">बी.एन.एन. त्रि-ग्रहीय एवं बहु-ग्रहीय महायोग डायमंड चक्र</text>
  <text x="280" y="55" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">Master Triplet Combinations in Bhrigu Nandi Nadi</text>
  <text x="280" y="70" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="9" font-weight="600" fill="#78716c" text-anchor="middle">Root (बीज), Carrier (माध्यम) एवं Fruit (फल) की शास्त्रीय श्रृंखला</text>


  
  <g transform="translate(24, 96)">
    <rect width="512" height="92" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <rect width="140" height="92" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="0.8"/>
    <text x="70" y="38" text-anchor="middle" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="900" fill="#b45309">गुरु + शनि + सूर्य</text>
    <text x="70" y="62" text-anchor="middle" font-family="'Kohinoor Devanagari', sans-serif" font-size="8.5" font-weight="700" fill="#475569">त्रि-ग्रहीय संयोग</text>

    <!-- Description -->
    <text x="155" y="30" font-family="'Noto Serif Devanagari', serif" font-size="12.5" font-weight="800" fill="#b45309">सर्वोच्च प्रशासनिक योग (IAS / Cabinet)</text>
    <text x="155" y="52" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#1e293b">• गुरु (जीव) + शनि (कर्म) + सूर्य (शासन) = देश/संस्थान का सर्वोच्च नेतृत्व, स्थायी मान-सम्मान व राजसत्ता।</text>
  </g>

  <g transform="translate(24, 200)">
    <rect width="512" height="92" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="140" height="92" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="70" y="38" text-anchor="middle" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="900" fill="#7c3aed">गुरु + शुक्र + केतु</text>
    <text x="70" y="62" text-anchor="middle" font-family="'Kohinoor Devanagari', sans-serif" font-size="8.5" font-weight="700" fill="#475569">त्रि-ग्रहीय संयोग</text>

    <!-- Description -->
    <text x="155" y="30" font-family="'Noto Serif Devanagari', serif" font-size="12.5" font-weight="800" fill="#7c3aed">ब्रह्मर्षि / आध्यात्मिक शिखर योग</text>
    <text x="155" y="52" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#1e293b">• गुरु (ज्ञान) + शुक्र (तप) + केतु (मोक्ष) = संन्यास, अलौकिक अंतर्ज्ञान, जगद्गुरु पद, निःस्वार्थ लोकमंगल।</text>
  </g>

  <g transform="translate(24, 304)">
    <rect width="512" height="92" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <rect width="140" height="92" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="0.8"/>
    <text x="70" y="38" text-anchor="middle" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="900" fill="#059669">शनि + बुध + शुक्र</text>
    <text x="70" y="62" text-anchor="middle" font-family="'Kohinoor Devanagari', sans-serif" font-size="8.5" font-weight="700" fill="#475569">त्रि-ग्रहीय संयोग</text>

    <!-- Description -->
    <text x="155" y="30" font-family="'Noto Serif Devanagari', serif" font-size="12.5" font-weight="800" fill="#059669">महा-व्यापारी योग (कुबेर साम्राज्य)</text>
    <text x="155" y="52" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#1e293b">• शनि (कर्म) + बुध (व्यापार) + शुक्र (धन/लक्ष्मी) = बहुराष्ट्रीय व्यापार, विशाल धन सम्पदा, वैश्विक ब्रांड।</text>
  </g>

  <g transform="translate(24, 408)">
    <rect width="512" height="92" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="140" height="92" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="70" y="38" text-anchor="middle" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="900" fill="#dc2626">मंगल + शनि + राहु</text>
    <text x="70" y="62" text-anchor="middle" font-family="'Kohinoor Devanagari', sans-serif" font-size="8.5" font-weight="700" fill="#475569">त्रि-ग्रहीय संयोग</text>

    <!-- Description -->
    <text x="155" y="30" font-family="'Noto Serif Devanagari', serif" font-size="12.5" font-weight="800" fill="#dc2626">अंतर्राष्ट्रीय तकनीकी / AI योग</text>
    <text x="155" y="52" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#1e293b">• मंगल (यंत्र) + शनि (श्रम/उद्योग) + राहु (विदेशी/सॉफ्टवेयर) = रक्षा तकनीक, एयरोस्पेस, विदेश में बड़ा उद्योग।</text>
  </g>

  <g transform="translate(24, 512)">
    <rect width="512" height="92" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="140" height="92" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="0.8"/>
    <text x="70" y="38" text-anchor="middle" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="900" fill="#0284c7">चन्द्र + केतु + गुरु</text>
    <text x="70" y="62" text-anchor="middle" font-family="'Kohinoor Devanagari', sans-serif" font-size="8.5" font-weight="700" fill="#475569">त्रि-ग्रहीय संयोग</text>

    <!-- Description -->
    <text x="155" y="30" font-family="'Noto Serif Devanagari', serif" font-size="12.5" font-weight="800" fill="#0284c7">सिद्ध योगी / प्रज्ञा-चक्षु योग</text>
    <text x="155" y="52" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#1e293b">• चन्द्र (मन) + केतु (सूक्ष्म दृष्टि) + गुरु (ईश्वरीय कृपा) = सटीक भविष्यवाणी, त्रिकालज्ञ, निस्पृह तपस्वी।</text>
  </g>

  <!-- Bottom Legend Footer -->
  <rect x="24" y="625" width="512" height="120" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
  <text x="280" y="648" font-family="'Noto Serif Devanagari', serif" font-size="11.5" font-weight="800" fill="#78350f" text-anchor="middle">★ त्रि-ग्रहीय संयोजन के ३ मूलभूत घटक ★</text>
  <text x="280" y="670" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">१. मूल कारण (Root): प्रथम ग्रह घटना का बीज व संकल्प निर्धारित करता है</text>
  <text x="280" y="692" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">२. माध्यम (Carrier): द्वितीय ग्रह साधन, वातावरण एवं कार्य-प्रणाली प्रदान करता है</text>
  <text x="280" y="714" font-family="'Kohinoor Devanagari', sans-serif" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">३. अंतिम फल (Fruit): तृतीय ग्रह परिणाम का अंतिम स्वरूप व प्रभाव तय करता है</text>
  <text x="280" y="734" font-family="'Kohinoor Devanagari', sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">सूत्र: तीन ग्रहों का त्रिकोण सम्मिश्रण जातक के जीवन की सबसे बड़ी दिशा तय करता है।</text>
</svg>