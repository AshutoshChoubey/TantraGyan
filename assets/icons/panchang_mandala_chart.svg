<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c140d" />
      <stop offset="45%" stop-color="#140f09" />
      <stop offset="85%" stop-color="#0a0704" />
      <stop offset="100%" stop-color="#050302" />
    </radialGradient>

    <!-- Node Glow Filters -->
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Element Gradients -->
    <linearGradient id="grad-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="grad-water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="grad-air" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <linearGradient id="grad-ether" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="grad-earth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Deep Sacred Canvas Background -->
  <rect width="900" height="900" fill="url(#bg-grad)" rx="24" />
  <rect width="880" height="880" x="10" y="10" fill="none" stroke="url(#gold-stroke)" stroke-width="2" rx="20" stroke-opacity="0.45" />
  <rect width="864" height="864" x="18" y="18" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="4,4" rx="16" stroke-opacity="0.3" />

  <!-- Outer Astral Compass Dial -->
  <g id="astral-rings" transform="translate(450, 450)">
    <circle r="390" fill="none" stroke="url(#gold-stroke)" stroke-width="1.5" stroke-opacity="0.3" />
    <circle r="365" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2,6" stroke-opacity="0.4" />
    <circle r="260" fill="none" stroke="url(#gold-stroke)" stroke-width="1" stroke-opacity="0.25" />
    <circle r="160" fill="none" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.35" />

    <!-- Connecting Sacred Pentagram Star Lines -->
    <!-- Top (0 deg: 0, -290) -->
    <!-- Right-Top (72 deg: 275.8, -89.6) -->
    <!-- Right-Bottom (144 deg: 170.5, 234.6) -->
    <!-- Left-Bottom (216 deg: -170.5, 234.6) -->
    <!-- Left-Top (288 deg: -275.8, -89.6) -->
    <path d="M 0 -290 L 170.5 234.6 L -275.8 -89.6 L 275.8 -89.6 L -170.5 234.6 Z" 
          fill="none" stroke="url(#gold-stroke)" stroke-width="1.6" stroke-opacity="0.35" stroke-dasharray="5,3" />

    <!-- Harmonic Octagram Background -->
    <polygon points="0,-160 113,-113 160,0 113,113 0,160 -113,113 -160,0 -113,-113" 
             fill="rgba(217, 119, 6, 0.04)" stroke="url(#gold-stroke)" stroke-width="0.8" stroke-opacity="0.35" />
  </g>

  <!-- Title & Institution Header (Top) -->
  <g id="header-text">
    <text x="450" y="52" font-family="'Cinzel', Georgia, serif" font-size="21" font-weight="800" fill="#fef3c7" text-anchor="middle" letter-spacing="2">
      TANTRA GYAN • VEDIC PANCHANGA MANDALA
    </text>
    <text x="450" y="78" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="0.5">
      पञ्चाङ्ग पञ्च-महाभूत काल-संयोजन महामण्डल (The Five Cosmic Limbs of Time)
    </text>
  </g>

  <!-- Center Core: Soli-Lunar Union (Surya-Chandra Yoga Core) -->
  <g id="center-core" transform="translate(450, 450)">
    <circle r="95" fill="#180f08" stroke="url(#gold-stroke)" stroke-width="2.5" filter="url(#glow-gold)" />
    <circle r="85" fill="#24170d" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Soli-Lunar Sacred Emblem (Sun & Crescent Moon) -->
    <circle r="42" fill="url(#grad-fire)" opacity="0.8" />
    <path d="M -15 -35 A 40 40 0 0 0 -15 35 A 32 32 0 0 1 -15 -35 Z" fill="#fef3c7" opacity="0.95" />
    <circle cx="10" cy="-6" r="16" fill="#fef08a" />

    <text x="0" y="55" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="800" fill="#fef3c7" text-anchor="middle">
      कालपुरुष चेतना
    </text>
    <text x="0" y="72" font-family="'Cinzel', serif" font-size="9.5" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="1">
      SOLI-LUNAR CONSCIOUSNESS
    </text>
  </g>

  <!-- 5 ELEMENTAL LIMB NODES (PANCHA ANGA) -->

  <!-- 1. TOP NODE: VAAR (Solar Day) — AGNI (Fire) -->
  <!-- Center: (450, 160) -->
  <g id="node-vaar" transform="translate(450, 160)">
    <line x1="0" y1="55" x2="0" y2="195" stroke="url(#grad-fire)" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8" />
    <circle r="68" fill="#1a110a" stroke="url(#grad-fire)" stroke-width="3" filter="url(#glow-gold)" />
    <circle r="56" fill="rgba(234, 88, 12, 0.12)" stroke="#f59e0b" stroke-width="1.2" />

    <!-- Symbol Icon (Sun Ray Emblem) -->
    <path d="M 0 -36 L 5 -20 L 0 -24 L -5 -20 Z" fill="#f59e0b" />
    <circle cx="0" cy="-14" r="10" fill="url(#grad-fire)" />

    <text x="0" y="8" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="800" fill="#fef3c7" text-anchor="middle">
      वार (Solar Day)
    </text>
    <text x="0" y="26" font-family="'Cinzel', serif" font-size="11" font-weight="800" fill="#f97316" text-anchor="middle" letter-spacing="1">
      AGNI • FIRE
    </text>
    <text x="0" y="42" font-family="'Noto Sans Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      शारीरिक ऊर्जा व दीर्घायु
    </text>
  </g>
  <!-- Vaar Spec Badge -->
  <g transform="translate(450, 245)">
    <rect x="-115" y="-13" width="230" height="26" rx="13" fill="#1c120c" stroke="#f97316" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="4" font-family="'Noto Sans Devanagari', sans-serif" font-size="10" font-weight="700" fill="#fed7aa" text-anchor="middle">
      7 सौर दिवस • सूर्य से शनि • जीवन शक्ति व नेतृत्व
    </text>
  </g>

  <!-- 2. RIGHT-TOP NODE: TITHI (Lunar Phase) — JALA (Water) -->
  <!-- Center: (726, 360) -->
  <g id="node-tithi" transform="translate(726, 360)">
    <line x1="-55" y1="18" x2="-181" y2="60" stroke="url(#grad-water)" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8" />
    <circle r="68" fill="#09141f" stroke="url(#grad-water)" stroke-width="3" filter="url(#glow-gold)" />
    <circle r="56" fill="rgba(2, 132, 199, 0.12)" stroke="#38bdf8" stroke-width="1.2" />

    <!-- Symbol Icon (Water Wave & Moon) -->
    <path d="M -12 -18 C -6 -28, 6 -28, 12 -18 C 6 -12, -6 -12, -12 -18 Z" fill="#38bdf8" />
    <circle cx="0" cy="-14" r="8" fill="url(#grad-water)" />

    <text x="0" y="8" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="800" fill="#f0f9ff" text-anchor="middle">
      तिथि (Lunar Phase)
    </text>
    <text x="0" y="26" font-family="'Cinzel', serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      JALA • WATER
    </text>
    <text x="0" y="42" font-family="'Noto Sans Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      मानसिक सुख, भाव व समृद्धि
    </text>
  </g>
  <!-- Tithi Spec Badge -->
  <g transform="translate(736, 445)">
    <rect x="-115" y="-13" width="230" height="26" rx="13" fill="#0c1824" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="4" font-family="'Noto Sans Devanagari', sans-serif" font-size="10" font-weight="700" fill="#bae6fd" text-anchor="middle">
      30 तिथियां • 12° चाप • नंदा, भद्रा, जया, रिक्ता, पूर्णा
    </text>
  </g>

  <!-- 3. RIGHT-BOTTOM NODE: NAKSHATRA (Lunar Mansion) — VAYU (Air) -->
  <!-- Center: (620, 685) -->
  <g id="node-nakshatra" transform="translate(620, 685)">
    <line x1="-42" y1="-45" x2="-120" y2="-160" stroke="url(#grad-air)" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8" />
    <circle r="68" fill="#140d21" stroke="url(#grad-air)" stroke-width="3" filter="url(#glow-gold)" />
    <circle r="56" fill="rgba(124, 58, 237, 0.12)" stroke="#a78bfa" stroke-width="1.2" />

    <!-- Symbol Icon (Cosmic Starburst) -->
    <circle cx="0" cy="-14" r="9" fill="url(#grad-air)" />
    <polygon points="0,-27 3,-17 13,-14 3,-11 0,-1 -3,-11 -13,-14 -3,-17" fill="#c4b5fd" />

    <text x="0" y="8" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="800" fill="#f5f3ff" text-anchor="middle">
      नक्षत्र (Star Mansion)
    </text>
    <text x="0" y="26" font-family="'Cinzel', serif" font-size="11" font-weight="800" fill="#a78bfa" text-anchor="middle" letter-spacing="1">
      VAYU • AIR
    </text>
    <text x="0" y="42" font-family="'Noto Sans Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      अवचेतन मन, प्रारब्ध व दिशा
    </text>
  </g>
  <!-- Nakshatra Spec Badge -->
  <g transform="translate(620, 770)">
    <rect x="-115" y="-13" width="230" height="26" rx="13" fill="#1b122c" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="4" font-family="'Noto Sans Devanagari', sans-serif" font-size="10" font-weight="700" fill="#ddd6fe" text-anchor="middle">
      27 नक्षत्र • 13°20' • अश्विनी से रेवती • 108 पद
    </text>
  </g>

  <!-- 4. LEFT-BOTTOM NODE: YOGA (Soli-Lunar Angle) — AKASHA (Ether) -->
  <!-- Center: (280, 685) -->
  <g id="node-yoga" transform="translate(280, 685)">
    <line x1="42" y1="-45" x2="120" y2="-160" stroke="url(#grad-ether)" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8" />
    <circle r="68" fill="#1c1307" stroke="url(#grad-ether)" stroke-width="3" filter="url(#glow-gold)" />
    <circle r="56" fill="rgba(217, 119, 6, 0.12)" stroke="#fcd34d" stroke-width="1.2" />

    <!-- Symbol Icon (Cosmic Spiral Aura) -->
    <circle cx="0" cy="-14" r="9" fill="url(#grad-ether)" />
    <circle cx="0" cy="-14" r="14" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="3,2" />

    <text x="0" y="8" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="800" fill="#fffbeb" text-anchor="middle">
      योग (Solar-Lunar Sum)
    </text>
    <text x="0" y="26" font-family="'Cinzel', serif" font-size="11" font-weight="800" fill="#fcd34d" text-anchor="middle" letter-spacing="1">
      AKASHA • ETHER
    </text>
    <text x="0" y="42" font-family="'Noto Sans Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      आत्मिक समरसता, स्वास्थ्य व योग
    </text>
  </g>
  <!-- Yoga Spec Badge -->
  <g transform="translate(280, 770)">
    <rect x="-115" y="-13" width="230" height="26" rx="13" fill="#201509" stroke="#d97706" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="4" font-family="'Noto Sans Devanagari', sans-serif" font-size="10" font-weight="700" fill="#fef08a" text-anchor="middle">
      27 योग • (सूर्य + चंद्र)/13°20' • विष्कम्भ से वैधृति
    </text>
  </g>

  <!-- 5. LEFT-TOP NODE: KARANA (Half-Tithi) — PRITHVI (Earth) -->
  <!-- Center: (174, 360) -->
  <g id="node-karana" transform="translate(174, 360)">
    <line x1="55" y1="18" x2="181" y2="60" stroke="url(#grad-earth)" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8" />
    <circle r="68" fill="#081912" stroke="url(#grad-earth)" stroke-width="3" filter="url(#glow-gold)" />
    <circle r="56" fill="rgba(5, 150, 105, 0.12)" stroke="#34d399" stroke-width="1.2" />

    <!-- Symbol Icon (Earth Square Diamond) -->
    <rect x="-9" y="-23" width="18" height="18" fill="url(#grad-earth)" transform="rotate(45, 0, -14)" />
    <circle cx="0" cy="-14" r="3" fill="#ecfdf5" />

    <text x="0" y="8" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="800" fill="#ecfdf5" text-anchor="middle">
      करण (Half-Tithi)
    </text>
    <text x="0" y="26" font-family="'Cinzel', serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1">
      PRITHVI • EARTH
    </text>
    <text x="0" y="42" font-family="'Noto Sans Devanagari', sans-serif" font-size="9.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      कर्म निष्पादन, क्षमता व सफलता
    </text>
  </g>
  <!-- Karana Spec Badge -->
  <g transform="translate(164, 445)">
    <rect x="-115" y="-13" width="230" height="26" rx="13" fill="#0b1f17" stroke="#059669" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="4" font-family="'Noto Sans Devanagari', sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      11 करण • 6° चाप • 7 चर + 4 स्थिर • कार्य सिद्धि
    </text>
  </g>

  <!-- Bottom Classical Authority Colophon -->
  <g id="footer-branding" transform="translate(450, 840)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#171008" stroke="url(#gold-stroke)" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="5" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" font-weight="700" fill="#fde68a" text-anchor="middle">
      शोधकर्त्ता: ज्योतिषाचार्य आशुतोष कुमार चौबे • तंत्र ज्ञान शोध संस्थान (t.worldgyan.com)
    </text>
  </g>
</svg>
